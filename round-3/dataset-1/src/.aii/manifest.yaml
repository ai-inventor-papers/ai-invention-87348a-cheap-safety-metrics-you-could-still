entries:
  - path: venv_ds/
    delete: regenerable
    source: "UV_PROJECT_ENVIRONMENT=venv_ds uv sync"
  - path: scripts/__pycache__/
    delete: regenerable
    source: "python bytecode cache; recreated automatically when scripts/*.py are imported"
  - path: results/
    keep: graded generations, judge cache/ledger and per-checkpoint outcome labels (hours of CPU generation + paid judge calls)
