entries:
  - path: venv_live/
    delete: regenerable
    source: "./install.sh cpu   # == UV_PROJECT_ENVIRONMENT=venv_live uv sync (pyproject.toml + uv.lock; torch 2.14.0+cpu)"
  - path: venv_gpu/
    delete: regenerable
    source: "./install.sh gpu   # torch 2.14.0 from https://download.pytorch.org/whl/cu130 + requirements_gpu.txt"
  - path: __pycache__/
    delete: regenerable
    source: "regenerated automatically on the next `venv_gpu/bin/python method.py` (any import)"
  - path: tests/__pycache__/
    delete: regenerable
    source: "regenerated automatically by `venv_gpu/bin/python -m pytest -c pytest.ini -q tests/test_live.py`"
  - path: .pytest_cache/
    delete: regenerable
    source: "venv_gpu/bin/python -m pytest -c pytest.ini -q tests/test_live.py"
