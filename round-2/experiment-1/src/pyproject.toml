[project]
name = "cheap-safety-family-axis"
version = "0.3.0"
description = "Iteration 2, experiment 1: repair the refusal readout, then buy the model-family axis"
requires-python = ">=3.12,<3.13"   # the run used CPython 3.12.14
# EVERY dependency pinned to the exact version installed in the run environment
# (`uv pip freeze --python venv_exp1/bin/python`, 2026-09-21). The environment lives in
# venv_exp1/ rather than .venv/ because a box-wide cleaner reaps `.venv` directories mid-run:
#   UV_PROJECT_ENVIRONMENT=venv_exp1 uv sync --python 3.12
# transformers stays on the 4.x line on purpose: 5.x removed the gemma2 / phi3 / olmo2 /
# smollm3 model modules, which is what cost iteration 1 fifteen of its checkpoints.
dependencies = [
    "accelerate==1.15.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "cloudpickle==3.1.2",
    "filelock==4.0.1",
    "frozenlist==1.8.0",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==0.36.2",
    "idna==3.20",
    "jinja2==3.1.6",
    "joblib==1.6.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "loguru==0.7.3",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "multidict==6.9.0",
    "narwhals==2.26.0",
    "networkx==3.6.1",
    "numpy==2.2.6",
    "packaging==26.3",
    "pandas==3.0.6",
    "propcache==0.5.4",
    "protobuf==7.36.2",
    "psutil==7.2.2",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "regex==2026.9.10",
    "requests==2.34.2",
    "rpds-py==2026.6.3",
    "safetensors==0.8.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "sentencepiece==0.2.2",
    "setuptools==84.0.0",
    "six==1.17.0",
    "sympy==1.13.1",
    "threadpoolctl==3.7.0",
    "tokenizers==0.22.2",
    "torch==2.6.0+cpu",
    "tqdm==4.70.1",
    "transformers==4.57.6",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "yarl==1.25.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
index-strategy = "unsafe-best-match"
# the pinned torch==2.6.0+cpu wheel and the whole run are linux x86_64
environments = ["sys_platform == 'linux'"]
