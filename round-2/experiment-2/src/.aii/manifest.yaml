  - path: .venv/
    delete: regenerable
    source: "partial remnant of a venv an external cleanup deleted mid-run (bin/ already gone); superseded by pyenv/ -- rebuild with the pyenv/ command above"
  - path: .venv_broken_1789974232/
    delete: regenerable
    source: "partial remnant of the first venv an external cleanup deleted mid-run (bin/ already gone); superseded by pyenv/ -- rebuild with the pyenv/ command above"
  - path: cache/
    delete: regenerable
    source: "OMP_NUM_THREADS=1 pyenv/bin/python method.py --stages ladder2 --passes 1,2,3  (rebuilds cache/grams/<host>/ float64 Gram stacks from the HF cache)"
