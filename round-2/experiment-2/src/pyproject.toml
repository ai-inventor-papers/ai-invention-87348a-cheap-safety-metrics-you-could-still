[project]
name = "forgery-ladder-iter2"
version = "2.1.0"
description = "What faking a safety score costs: a six-rung forgery ladder with blind and family-aware auditor screens, a two-sided ground truth, and ROSI's alpha recovered by reproduction"
requires-python = ">=3.12,<3.13"
# EVERY package installed in the run's environment (pyenv/), pinned to the exact
# version that produced the results (`uv pip freeze --python pyenv/bin/python`).
dependencies = [
  "accelerate==1.15.0",
  "annotated-doc==0.0.5",
  "anyio==4.15.1",
  "attrs==26.1.0",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
  "click==8.5.0",
  "cloudpickle==3.1.2",
  "filelock==4.0.1",
  "formulaic==1.2.2",
  "fsspec==2026.9.0",
  "h11==0.16.0",
  "hf-xet==1.6.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "huggingface-hub==1.32.0",
  "idna==3.20",
  "interface-meta==2.0.1",
  "jinja2==3.1.6",
  "joblib==1.6.0",
  "jsonschema==4.26.0",
  "jsonschema-specifications==2025.9.1",
  "loguru==0.7.3",
  "markdown-it-py==4.2.0",
  "markupsafe==3.0.3",
  "mdurl==0.1.2",
  "mpmath==1.3.0",
  "narwhals==2.26.0",
  "networkx==3.6.1",
  "numpy==2.5.3",
  "packaging==26.3",
  "pandas==3.0.6",
  "patsy==1.0.3",
  "psutil==7.2.2",
  "pygments==2.21.0",
  "python-dateutil==2.9.0.post0",
  "pyyaml==6.0.3",
  "referencing==0.37.0",
  "regex==2026.9.10",
  "requests==2.34.2",
  "rich==15.0.0",
  "rpds-py==2026.6.3",
  "safetensors==0.8.0",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "setuptools==84.0.0",
  "shellingham==1.5.4",
  "six==1.17.0",
  "statsmodels==0.15.0",
  "sympy==1.14.0",
  "threadpoolctl==3.7.0",
  "tokenizers==0.23.2",
  "torch==2.14.0+cpu",
  "tqdm==4.70.1",
  "transformers==5.17.0",
  "typer==0.27.2",
  "typing-extensions==4.16.0",
  "urllib3==2.8.0",
  "wrapt==2.4.1",
]

# torch is the CPU wheel (this box had no GPU); resolve it from PyTorch's CPU index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# NOTES (measured on THIS box, 2026-09-21):
#   * NO GPU. /dev/nvidia* absent, torch.cuda.is_available() == False -> CPU wheels.
#   * 2 logical CPUs and a 16 GB cgroup SHARED INSIDE THE CONTAINER with two sibling
#     experiments (~0.3 core per process; 9 OOM kills during the run).
#   * NO C compiler -> Triton/inductor stay disabled:
#     TORCH_COMPILE_DISABLE=1 TORCHINDUCTOR_DISABLE=1 TORCHDYNAMO_DISABLE=1.
#   * The environment lives in pyenv/, not .venv/: an external reaper deleted
#     .venv/ (bin/ first) twice mid-run.
#   * peft/trl deliberately NOT installed: F3/F4 are merged-LoRA-shaped deltas
#     (trained=false); flab2/rungs.py ships its own delta construction.
