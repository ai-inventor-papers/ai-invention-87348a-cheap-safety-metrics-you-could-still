[project]
name = "cheap-safety-screen"
version = "0.1.0"
description = "One harvest, five cheap single-checkpoint safety reads, one race"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "transformers>=4.51.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.26.0",
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "loguru>=0.7",
    "requests>=2.32",
    "aiohttp>=3.10",
    "tqdm>=4.66",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "jsonschema>=4.22",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.uv]
index-strategy = "unsafe-best-match"
