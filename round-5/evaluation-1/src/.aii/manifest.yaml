entries:
  - path: .venv/
    delete: regenerable
    source: "./install.sh  (uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python numpy scipy pandas matplotlib loguru pytest)"
  - path: __pycache__/
    delete: regenerable
    source: ".venv/bin/python eval.py"
  - path: tests/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m pytest tests/test_perm_exact.py -q -o addopts='' --confcutdir=\"$(pwd)\""
